<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración · Insignias GDEE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e1a2b;
    --bg-deep: #091220;
    --panel: #142640;
    --panel-border: #23405f;
    --gold: #d9a441;
    --gold-deep: #b9862b;
    --teal: #5fa8a0;
    --text: #ede7d8;
    --text-dim: #93a5ba;
    --danger: #d97a6a;
    --radius-panel: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 50% -10%, #17304d 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 18px 64px;
  }

  .stage {
    width: 100%;
    max-width: 720px;
  }

  .top {
    text-align: center;
    margin-bottom: 26px;
  }
  .top h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: 28px;
    margin: 0;
    color: var(--text);
  }
  .top h1 .accent { font-style: normal; color: var(--gold); }
  .top p {
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 8px 0 0;
  }

  .search-row { margin-bottom: 20px; }
  input[type="text"] {
    width: 100%;
    background: var(--bg-deep);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 10px;
    outline: none;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  input[type="text"]:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(217,164,65,.18);
  }
  input[type="text"]::placeholder { color: #5c6f85; }

  /* ---------- States ---------- */
  .state { display: none; }
  .state.active { display: block; }

  #state-loading, #state-error {
    background: linear-gradient(180deg, var(--panel) 0%, #10203a 100%);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-panel);
    padding: 32px 24px;
    text-align: center;
  }
  .ring {
    width: 40px; height: 40px;
    margin: 0 auto 14px;
    border-radius: 50%;
    border: 3px solid var(--panel-border);
    border-top-color: var(--gold);
    animation: spin 900ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #state-loading p, #state-error p { color: var(--text-dim); font-size: 14px; margin: 0; }
  #state-error p.danger { color: var(--danger); margin-bottom: 6px; font-weight: 600; }

  /* ---------- User list ---------- */
  #user-list { display: flex; flex-direction: column; gap: 16px; }

  .empty-case {
    text-align: center;
    padding: 28px 10px;
    color: var(--text-dim);
    font-size: 14.5px;
  }
  .empty-case.small { padding: 6px 0; font-size: 13px; text-align: left; }

  .user-card {
    background: linear-gradient(180deg, var(--panel) 0%, #10203a 100%);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius-panel);
    padding: 18px 18px 20px;
  }

  .user-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .user-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0;
    color: var(--text);
    word-break: break-word;
  }

  .add-btn {
    flex: none;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 150ms ease, background 150ms ease;
  }
  .add-btn:hover { border-color: var(--gold); background: rgba(217,164,65,.08); }
  .add-btn.active { border-color: var(--teal); color: var(--teal); }

  .badge-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .badge-tile {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    cursor: pointer;
  }
  .badge-tile.owned:hover { outline: 2px solid var(--danger); outline-offset: 2px; }
  .badge-tile.pick:hover { outline: 2px solid var(--teal); outline-offset: 2px; }
  .badge-tile.already { opacity: .45; }

  .badge-medal {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0c876 0%, var(--gold) 45%, var(--gold-deep) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    overflow: hidden;
    box-shadow:
      0 0 0 2px var(--bg-deep),
      0 0 0 3px var(--panel-border);
  }
  .badge-medal img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .check-mark {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--teal);
    color: #06140f;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 2px var(--bg-deep);
  }

  /* Add-badge picker */
  .picker {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-border);
  }
  .picker.open { display: block; }
  .picker-label {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="stage">

    <div class="top">
      <h1>Panel de <span class="accent">administración</span></h1>
      <p>Insignias GDEE &middot; RSEF &middot; Universidad de Oviedo</p>
    </div>

    <div class="search-row">
      <input type="text" id="search-input" placeholder="Buscar usuario por nombre&hellip;">
    </div>

    <div class="state" id="state-loading">
      <div class="ring"></div>
      <p>Cargando usuarios e insignias&hellip;</p>
    </div>

    <div class="state" id="state-error">
      <p class="danger">No se ha podido cargar la información.</p>
      <p>Comprueba la conexión y recarga la página.</p>
    </div>

    <div class="state" id="state-panel">
      <div id="user-list"></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
  // ---------- Firebase ----------
  const firebaseConfig = {
    apiKey: "AIzaSyB_PGWy13_8FK--jHlqXN65mWKq0nqzDds",
    authDomain: "insignias-gdee-uniovi.firebaseapp.com",
    databaseURL: "https://insignias-gdee-uniovi-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "insignias-gdee-uniovi",
    storageBucket: "insignias-gdee-uniovi.firebasestorage.app",
    messagingSenderId: "748330072664",
    appId: "1:748330072664:web:7df4c9e6c5b345dcec682d"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ---------- State helpers ----------
  const states = ['state-loading', 'state-error', 'state-panel'];
  function showState(id) {
    states.forEach(s => document.getElementById(s).classList.toggle('active', s === id));
  }

  // ---------- Data ----------
  let usuariosData = {};    // { uuid: { nombre } }
  let relacionesData = {};  // { uuid: { insigniaId: true } }
  let insigniasData = {};   // { insigniaId: { nombre, icono, descripcion, ruta } }

  const badgeGridByUuid = new Map();
  const pickerByUuid = new Map();

  function cargarTodo() {
    showState('state-loading');
    Promise.all([
      db.ref('usuarios').once('value'),
      db.ref('usuarios_isignias').once('value'),
      db.ref('insignias').once('value')
    ]).then(([uSnap, rSnap, iSnap]) => {
      usuariosData = uSnap.val() || {};
      relacionesData = rSnap.val() || {};
      insigniasData = iSnap.val() || {};
      renderUsuarios();
      showState('state-panel');
    }).catch(() => {
      showState('state-error');
    });
  }

  // ---------- Badge medal (image with emoji fallback) ----------
  function buildMedal(info) {
    const medal = document.createElement('div');
    medal.className = 'badge-medal';
    const nombre = info.nombre || '';
    const icono = info.icono || '🏅';

    if (info.ruta) {
      const img = document.createElement('img');
      img.src = encodeURI(info.ruta);
      img.alt = '';
      img.loading = 'lazy';
      img.onerror = function () {
        img.remove();
        medal.textContent = icono;
      };
      medal.appendChild(img);
    } else {
      medal.textContent = icono;
    }
    return medal;
  }

  // ---------- Render: user list ----------
  function renderUsuarios() {
    const listEl = document.getElementById('user-list');
    listEl.innerHTML = '';
    badgeGridByUuid.clear();
    pickerByUuid.clear();

    const entries = Object.keys(usuariosData).map(uuid => ({ uuid, usuario: usuariosData[uuid] || {} }));

    if (entries.length === 0) {
      listEl.innerHTML = '<div class="empty-case">Todavía no hay usuarios registrados.</div>';
      return;
    }

    entries.sort((a, b) => (a.usuario.nombre || '').localeCompare(b.usuario.nombre || '', 'es', { sensitivity: 'base' }));

    entries.forEach(({ uuid, usuario }) => {
      listEl.appendChild(buildUserCard(uuid, usuario));
    });

    applyFilter();
  }

  function buildUserCard(uuid, usuario) {
    const card = document.createElement('div');
    card.className = 'user-card';
    card.dataset.nombre = (usuario.nombre || '').toLowerCase();

    const header = document.createElement('div');
    header.className = 'user-card-header';

    const name = document.createElement('h2');
    name.className = 'user-name';
    name.textContent = usuario.nombre || '(sin nombre)';

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-btn';
    addBtn.textContent = '+ Añadir insignia';
    addBtn.addEventListener('click', () => togglePicker(uuid, addBtn));

    header.appendChild(name);
    header.appendChild(addBtn);
    card.appendChild(header);

    const badgeGrid = document.createElement('div');
    badgeGrid.className = 'badge-grid';
    badgeGridByUuid.set(uuid, badgeGrid);
    card.appendChild(badgeGrid);

    const picker = document.createElement('div');
    picker.className = 'picker';
    pickerByUuid.set(uuid, picker);
    card.appendChild(picker);

    renderOwnedBadges(uuid);
    renderPicker(uuid);

    return card;
  }

  // ---------- Render: badges a user has (click to remove) ----------
  function renderOwnedBadges(uuid) {
    const grid = badgeGridByUuid.get(uuid);
    if (!grid) return;
    grid.innerHTML = '';

    const relaciones = relacionesData[uuid] || {};
    const ids = Object.keys(relaciones);

    if (ids.length === 0) {
      grid.innerHTML = '<div class="empty-case small">Todavía no tiene insignias.</div>';
      return;
    }

    ids.forEach(id => {
      const info = insigniasData[id] || {};
      const nombre = info.nombre || id;

      const tile = document.createElement('div');
      tile.className = 'badge-tile owned';
      tile.title = 'Clic para quitar · ' + nombre;
      tile.appendChild(buildMedal(info));
      tile.addEventListener('click', () => quitarInsignia(uuid, id, info));
      grid.appendChild(tile);
    });
  }

  // ---------- Render: picker with every badge in the DB (click to add) ----------
  function renderPicker(uuid) {
    const picker = pickerByUuid.get(uuid);
    if (!picker) return;
    picker.innerHTML = '';

    const allIds = Object.keys(insigniasData);

    const label = document.createElement('p');
    label.className = 'picker-label';
    label.textContent = 'Todas las insignias · clic para añadir';
    picker.appendChild(label);

    if (allIds.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-case small';
      empty.textContent = 'No hay insignias creadas todavía.';
      picker.appendChild(empty);
      return;
    }

    const relaciones = relacionesData[uuid] || {};
    const grid = document.createElement('div');
    grid.className = 'badge-grid';

    allIds.forEach(id => {
      const info = insigniasData[id] || {};
      const nombre = info.nombre || id;
      const yaLaTiene = !!relaciones[id];

      const tile = document.createElement('div');
      tile.className = 'badge-tile pick' + (yaLaTiene ? ' already' : '');
      tile.title = (yaLaTiene ? 'Ya la tiene · ' : 'Clic para añadir · ') + nombre;
      tile.appendChild(buildMedal(info));

      if (yaLaTiene) {
        const check = document.createElement('span');
        check.className = 'check-mark';
        check.textContent = '✓';
        tile.appendChild(check);
      }

      tile.addEventListener('click', () => anadirInsignia(uuid, id, info));
      grid.appendChild(tile);
    });

    picker.appendChild(grid);
  }

  function togglePicker(uuid, btn) {
    const picker = pickerByUuid.get(uuid);
    if (!picker) return;
    const open = picker.classList.toggle('open');
    btn.classList.toggle('active', open);
    btn.textContent = open ? '– Cerrar' : '+ Añadir insignia';
  }

  // ---------- Actions ----------
  function anadirInsignia(uuid, insigniaId, info) {
    db.ref('usuarios_isignias/' + uuid + '/' + insigniaId).set(true)
      .then(() => {
        if (!relacionesData[uuid]) relacionesData[uuid] = {};
        relacionesData[uuid][insigniaId] = true;
        renderOwnedBadges(uuid);
        renderPicker(uuid);
      })
      .catch(() => alert('No se ha podido añadir la insignia. Inténtalo de nuevo.'));
  }

  function quitarInsignia(uuid, insigniaId, info) {
    const usuario = usuariosData[uuid] || {};
    const nombreInsignia = info.nombre || insigniaId;
    const nombreUsuario = usuario.nombre || 'este usuario';
    if (!confirm('¿Quitar la insignia "' + nombreInsignia + '" a ' + nombreUsuario + '?')) return;

    db.ref('usuarios_isignias/' + uuid + '/' + insigniaId).remove()
      .then(() => {
        if (relacionesData[uuid]) delete relacionesData[uuid][insigniaId];
        renderOwnedBadges(uuid);
        renderPicker(uuid);
      })
      .catch(() => alert('No se ha podido quitar la insignia. Inténtalo de nuevo.'));
  }

  // ---------- Search ----------
  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', applyFilter);
  function applyFilter() {
    const q = searchInput.value.trim().toLowerCase();
    document.querySelectorAll('.user-card').forEach(card => {
      const match = !q || card.dataset.nombre.includes(q);
      card.style.display = match ? '' : 'none';
    });
  }

  // ---------- Boot ----------
  cargarTodo();
</script>

</body>
</html>
